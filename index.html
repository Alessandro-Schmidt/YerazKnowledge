<!doctype html>
<html lang="en" data-base="vanta" data-mode="dark" data-accent="green" data-font="geist">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Your notes as a map, kept in your own GitHub repositories." />
    <!-- ?v= is the icons' version (ICONS in vite.config.ts): new artwork, new addresses. -->
    <link rel="icon" href="./favicon.svg?v=leaf" type="image/svg+xml" />
    <link rel="icon" href="./favicon.ico?v=leaf" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=leaf" />
    <title>Yeraz</title>
    <!-- The saved theme, set before the first paint so the wrong one never flashes (ui/theme.ts).
         A custom theme's CSS was generated from checked colours (ui/customTheme.ts). -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('yeraz-theme'))
        if (t)
          for (var k of ['base', 'mode', 'accent', 'font'])
            if (t[k]) document.documentElement.dataset[k] = t[k]
        if (t && t.custom) {
          var s = document.createElement('style')
          s.id = 'yeraz-custom'
          s.textContent = t.custom
          document.head.appendChild(s)
          document.documentElement.dataset.custom = ''
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
