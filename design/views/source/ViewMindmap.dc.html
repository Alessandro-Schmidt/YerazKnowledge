<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400;500&amp;family=Newsreader:opsz,wght@6..72,400..600&amp;display=swap">
<style>
body{margin:0}
.yz,.yz[data-base="vanta"]{--bg:#030303;--top:#050606;--panel:#0A0B0B;--raised:#121514;--hover:#101211;--hair:#1C1E1D;--hair-strong:#2A2E2B;--text:#E8EAE6;--text-body:#C9CEC9;--muted:#8D918C;--faint:#7D827C;--node:#DCE3DE;--line:#E8EAE6;--core:#0B0D0C;--grid:rgba(255,255,255,0.05);--shadow:rgba(0,0,0,0.6)}
.yz[data-base="graphite"]{--bg:#15171B;--top:#191B20;--panel:#1E2126;--raised:#272B31;--hover:#24282E;--hair:#2D3138;--hair-strong:#3A3F47;--text:#E7E9EC;--text-body:#C9CDD3;--muted:#9CA2AB;--faint:#9399A2;--node:#D5DAE0;--line:#E7E9EC;--core:#1E2126;--grid:rgba(255,255,255,0.06);--shadow:rgba(0,0,0,0.45)}
.yz[data-base="paper"]{--bg:#F3F1EB;--top:#EEEBE3;--panel:#FBFAF6;--raised:#E9E6DD;--hover:#EFECE5;--hair:#DDD9CF;--hair-strong:#CBC6BA;--text:#1B1C1A;--text-body:#363834;--muted:#5D605A;--faint:#62655F;--node:#2B2D2A;--line:#1B1C1A;--core:#FBFAF6;--grid:rgba(0,0,0,0.07);--shadow:rgba(40,35,20,0.16)}
.yz{--accent:#4BE3A0;--accent-soft:rgba(75,227,160,0.12);--on-accent:#06140D}
.yz[data-mode="dark"][data-accent="green"]{--accent:#4BE3A0;--accent-soft:rgba(75,227,160,0.12);--on-accent:#06140D}
.yz[data-mode="light"][data-accent="green"]{--accent:#0B7A4B;--accent-soft:rgba(11,122,75,0.1);--on-accent:#FFFFFF}
.yz[data-mode="dark"][data-accent="amber"]{--accent:#E8B65A;--accent-soft:rgba(232,182,90,0.12);--on-accent:#06140D}
.yz[data-mode="light"][data-accent="amber"]{--accent:#94590A;--accent-soft:rgba(148,89,10,0.1);--on-accent:#FFFFFF}
.yz[data-mode="dark"][data-accent="blue"]{--accent:#7FB3F5;--accent-soft:rgba(127,179,245,0.12);--on-accent:#06140D}
.yz[data-mode="light"][data-accent="blue"]{--accent:#1F5BB5;--accent-soft:rgba(31,91,181,0.1);--on-accent:#FFFFFF}
.yz[data-mode="dark"][data-accent="violet"]{--accent:#B9A2F5;--accent-soft:rgba(185,162,245,0.12);--on-accent:#06140D}
.yz[data-mode="light"][data-accent="violet"]{--accent:#6743C4;--accent-soft:rgba(103,67,196,0.1);--on-accent:#FFFFFF}
.yz .reading{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}
.yz[data-font="serif"] .reading{font-family:'Newsreader',Georgia,serif;font-size:1.07em}
.yz a{color:var(--accent)}.yz a:hover{color:var(--text)}
.yz button{font:inherit;color:inherit}
.yz :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.yz input::placeholder{color:var(--faint)}
.ic{fill:none;stroke:currentColor;stroke-width:1.6px;stroke-linecap:round;stroke-linejoin:round}
.griddot{fill:var(--grid)}
.bg{fill:transparent}
.orbit{fill:none;stroke:var(--grid);stroke-dasharray:2 6}
.edge{fill:none;stroke:var(--line);stroke-opacity:.13;stroke-width:1px;transition:stroke-opacity .25s}
.edge.hot{stroke-opacity:.42}
.thr{fill:none;stroke:var(--accent);stroke-width:1.1px;stroke-opacity:.42;transition:stroke-opacity .25s}
.thr.hot{stroke-opacity:.95;stroke-width:2px}
.thr.cold{stroke-opacity:.1}
.seg{fill:none;stroke:var(--accent);stroke-width:5px;stroke-opacity:.38}
.seg.hot{stroke-opacity:1}
.n{cursor:pointer;transition:opacity .25s}
.n.dim{opacity:.3}
.hit{fill:transparent}
.dot{stroke-width:1.4px}
.ring{fill:none;stroke:var(--node);stroke-opacity:.45;stroke-width:1px}
.halo{fill:none;stroke:var(--accent);stroke-width:1px}
.lbl{font-size:13px;fill:var(--text);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.blbl{font-size:10.5px;letter-spacing:.14em;font-weight:500;fill:var(--accent)}
.lsel{font-weight:600;fill:var(--accent)}
.a-start{text-anchor:start}.a-end{text-anchor:end}.a-mid{text-anchor:middle}
.coreg{cursor:pointer}
.core{fill:var(--core);stroke:var(--line);stroke-opacity:.12}
.coreg.sel .core{stroke-opacity:.5}
.coretitle{font-size:12px;font-weight:500;fill:var(--text);text-anchor:middle}
.corelbl{font-family:'Geist Mono',ui-monospace,monospace;font-size:9.5px;fill:var(--muted);text-anchor:middle}
.hide{display:none}
.cam{transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.xrow{transition:background .15s}
.xrow:hover{background:var(--hover)}
.xrow.on{background:var(--raised);box-shadow:inset 2px 0 0 var(--accent)}
.chev svg{transition:transform .15s}
.chev.open svg{transform:rotate(90deg)}
.chev.none{visibility:hidden}
.gl{flex-shrink:0;width:9px;height:9px;border-radius:50%;box-sizing:border-box}
.gl-leaf{background:var(--node)}
.gl-sprout{background:var(--node);box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--faint)}
.gl-branch{border:1.5px solid var(--accent)}
.ibtn:hover{background:var(--hover)}
.ibtn.on{background:var(--raised);color:var(--text)}
.ghost:hover{background:var(--hover)}
.primary:hover{filter:brightness(1.08)}
.mention{display:inline-flex;align-items:center;gap:4px;padding:0 6px;border:0;border-radius:6px;background:var(--accent-soft);color:var(--accent);cursor:pointer;font-size:14px;line-height:1.55;font-family:'Geist',ui-sans-serif,system-ui,sans-serif}
.mention:hover{box-shadow:inset 0 0 0 1px var(--accent)}
.lrow:hover{background:var(--hover)}
.chip:hover{border-color:var(--hair-strong)}

.yz .vtab{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:7px;color:var(--muted);font-size:12.5px;text-decoration:none;white-space:nowrap}
.yz .vtab:hover{background:var(--hover);color:var(--text)}
.yz .vtab.on{background:var(--raised);color:var(--text);box-shadow:inset 0 0 0 1px var(--hair-strong)}
.yz .vtab.on svg{color:var(--accent)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.eyebrow{font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row{transition:background .15s}
.row:hover{background:var(--hover)}
.row.on{background:var(--raised);box-shadow:inset 2px 0 0 var(--accent)}
.tile{transition:box-shadow .15s}
.tile:hover{box-shadow:inset 0 0 0 1px var(--hair-strong)}
</style>
</helmet>
