name: Nightly

# browsers: the end-to-end tests on every browser, WebKit and the emulated phones too, which
# CI leaves out to stay fast (ci.yml). A failure here is a bug to fix, not a block on main.
#
# contract: the app against real GitHub (development-plan.md §7.5): catches API,
# error-message and CORS changes the fake can't know about. Needs two settings in the repository:
#   secret   YERAZ_CONTRACT_TOKEN  fine-grained token, Contents: read and write on the repo below
#   variable YERAZ_CONTRACT_REPO   owner/yeraz-contract-test (private, holds a .yeraz.json)

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  contract:
    runs-on: ubuntu-24.04
    if: ${{ vars.YERAZ_CONTRACT_REPO != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run contract
        env:
          YERAZ_CONTRACT_TOKEN: ${{ secrets.YERAZ_CONTRACT_TOKEN }}
          YERAZ_CONTRACT_REPO: ${{ vars.YERAZ_CONTRACT_REPO }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: contract-results
          path: test-results
          retention-days: 14
