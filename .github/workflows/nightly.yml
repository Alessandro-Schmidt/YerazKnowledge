name: Nightly contract test

# The app against real GitHub (development-plan.md §7.5): catches API, error-message and
# CORS changes the fake can't know about. Needs two settings in the repository:
#   secret   YERAZ_CONTRACT_TOKEN  fine-grained token, Contents: read and write on the repo below
#   variable YERAZ_CONTRACT_REPO   owner/yeraz-contract-test (private, holds a .yeraz.json)

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    if: ${{ vars.YERAZ_CONTRACT_REPO != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run contract
        env:
          YERAZ_CONTRACT_TOKEN: ${{ secrets.YERAZ_CONTRACT_TOKEN }}
          YERAZ_CONTRACT_REPO: ${{ vars.YERAZ_CONTRACT_REPO }}
      # No test-results artifact: its page snapshots can show the token, and artifacts of a
      # public repository can be downloaded by anyone. The log says what failed.
