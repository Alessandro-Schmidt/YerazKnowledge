name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vite build
      - name: No test-only code in the production build
        run: '! grep -rl "__YERAZ_API__\\|VITE_E2E" dist'
      - run: npm run size
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  perf:
    # Budgets from ARCHITECTURE.md §11 (development-plan.md §7.4). Non-blocking for now:
    # shared runners are noisy.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run perf
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-results
          path: perf-results
          retention-days: 30

  desktop:
    # The Tauri shell compiles (src-tauri/). Only when it, the packages or the workflows changed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! git cat-file -e "$base" 2>/dev/null ||
            git diff --name-only "$base" HEAD | grep -qE '^(src-tauri/|package(-lock)?\.json$|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: steps.changed.outputs.run
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - if: steps.changed.outputs.run
        run: npm ci && npx vite build
      - if: steps.changed.outputs.run
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
