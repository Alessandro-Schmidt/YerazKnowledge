name: CI

# Fast on every push and pull request: the checks, then the end-to-end tests on Chromium.
# WebKit and the phones run nightly (nightly.yml), the desktop build when src-tauri/ changes
# (desktop.yml), so a slow or flaky emulator never holds back a merge or a deploy.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vite build
      - name: No test-only code in the production build
        run: '! grep -rl "__YERAZ_API__\\|VITE_E2E" dist'
      - run: npm run size
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Playwright's image has the browsers and their system libraries: nothing to download.
    # Its tag follows @playwright/test (also in nightly.yml and snapshots.yml).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The image matches @playwright/test
        run: test "$(node -p "require('@playwright/test/package.json').version")" = 1.64.1
      - run: npm run e2e -- --project=chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
