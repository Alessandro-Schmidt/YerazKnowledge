name: CI

# Fast on every push and pull request: the checks, then the end-to-end tests on Chromium.
# WebKit and the phones run nightly (nightly.yml), the desktop build when src-tauri/ changes
# (desktop.yml), so a slow or flaky emulator never holds back a merge or a deploy.
# Branches: work goes to develop; main takes releases only (a pull request from develop, or
# a hotfix/ branch), and a push to main is what deploys the site.

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vite build
      - name: No test-only code in the production build
        run: '! grep -rl "__YERAZ_API__\\|VITE_E2E" dist'
      - run: npm run size
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Playwright's image has the browsers and their system libraries: nothing to download.
    # Its tag follows @playwright/test (also in nightly.yml and snapshots.yml).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The image matches @playwright/test
        run: test "$(node -p "require('@playwright/test/package.json').version")" = 1.64.1
      - run: npm run e2e -- --project=chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  # Required in main's ruleset: main takes a release from develop, or a hotfix/ branch of this
  # repository, nothing else. The branch name is read from the environment, never pasted into
  # the script (it is the pull request author's text).
  release-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: A pull request into main comes from develop or a hotfix/ branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::Pull requests into main come from this repository's develop or hotfix/ branches. Open this one against develop."
            exit 1
          fi
          case "$HEAD_REF" in
            develop | hotfix/*) echo "From $HEAD_REF: fine." ;;
            *)
              echo "::error::Pull requests into main come from develop (a release) or a hotfix/ branch, not from $HEAD_REF. Open this one against develop."
              exit 1
              ;;
          esac

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
