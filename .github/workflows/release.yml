name: Release

# A version tag (v1.2.3) builds the desktop app for Windows, macOS and Linux and attaches
# the installers to a draft GitHub Release (ARCHITECTURE.md §10). Unsigned for now (§11).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
          - os: ubuntu-24.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - name: Both macOS architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      # Pinned to a commit: this step holds a token that can write releases.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Yeraz ${{ github.ref_name }}
          releaseBody: 'Unsigned builds: see the README for how to open them the first time.'
          releaseDraft: true
          args: ${{ matrix.args }}
      # Smoke test (development-plan.md §7.1): the app that was just built starts and is
      # still running 15 s later, so a build that crashes on launch never ships.
      - name: Launches (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          set +e
          timeout 15 xvfb-run -a src-tauri/target/release/yeraz
          code=$?
          set -e
          test $code -eq 124 || { echo "Yeraz exited with $code"; exit 1; }
      - name: Launches (macOS)
        if: runner.os == 'macOS'
        run: |
          src-tauri/target/universal-apple-darwin/release/yeraz &
          pid=$!
          sleep 15
          kill -0 $pid || { echo "Yeraz exited"; exit 1; }
          kill $pid
      - name: Launches (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath src-tauri/target/release/yeraz.exe -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "Yeraz exited with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id
