name: Release

# A version tag (v1.2.3) builds the desktop app for Windows, macOS and Linux and attaches
# the installers to a draft GitHub Release (ARCHITECTURE.md §10). Unsigned for now (§11).
on:
  push:
    tags: ['v*']

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
          - os: ubuntu-24.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - name: Both macOS architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Yeraz ${{ github.ref_name }}
          releaseBody: 'Unsigned builds: see the README for how to open them the first time.'
          releaseDraft: true
          args: ${{ matrix.args }}
