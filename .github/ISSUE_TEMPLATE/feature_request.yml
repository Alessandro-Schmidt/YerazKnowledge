name: Idea or feature request
description: Something Yeraz could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How it could work. Sketches and examples from other apps help.
  - type: textarea
    id: format
    attributes:
      label: Does it change the files?
      description: >-
        Notes must stay plain Markdown that reads well on github.com (ARCHITECTURE.md §4).
        Say if the idea needs anything new in the repository format.
