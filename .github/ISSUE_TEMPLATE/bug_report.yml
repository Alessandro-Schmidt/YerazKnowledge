name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste a GitHub token here.** For a security problem, use
        *Report a vulnerability* on the Security tab instead (SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a Family with …
        2. Select …
        3. …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Web app on a computer
        - Web app on a phone or tablet
        - Desktop app (Windows)
        - Desktop app (macOS)
        - Desktop app (Linux)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140, Safari 19, Firefox 145…
  - type: dropdown
    id: storage
    attributes:
      label: Where the notes are kept
      options:
        - A GitHub repository
        - A folder on this device
        - The browser's own storage
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, a small Markdown file that shows the problem, errors from the browser console.
